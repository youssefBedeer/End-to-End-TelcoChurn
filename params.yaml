xgboost_params:
  n_estimators:
    type: int
    low: 300
    high: 800

  learning_rate:
    type: float
    low: 0.01
    high: 0.2

  max_depth:
    type: int
    low: 3
    high: 10

  subsample:
    type: float
    low: 0.5
    high: 1.0

  colsample_bytree:
    type: float
    low: 0.5
    high: 1.0

  min_child_weight:
    type: int
    low: 1
    high: 10

  gamma:
    type: float
    low: 0
    high: 5

  reg_alpha:
    type: float
    low: 0
    high: 5

  reg_lambda:
    type: float
    low: 0
    high: 5

  random_state: 42
  n_jobs: -1
  scale_pos_weight: auto
  eval_metric: logloss
