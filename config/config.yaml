artifacts_root : artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  source_url: https://github.com/youssefBedeer/data-repository/raw/refs/heads/main/Telco-Customer-Churn.zip
  local_data_file: artifacts/data_ingestion/data.zip
  unzip_dir: artifacts/data_ingestion

data_validation:
  root_dir: artifacts/data_validation 
  STATUS_FILE: artifacts/data_validation/status.txt
  data_dir: artifacts/data_ingestion/Telco-Customer-Churn.csv 

data_transformation:
  root_dir: artifacts/data_transformation 
  data_path: artifacts/data_ingestion/Telco-Customer-Churn.csv
  target_name: Churn
  transformer_path: artifacts/data_transformation/preprocessor.joblib
  X_train_path: artifacts/data_transformation/X_train.npz
  X_test_path: artifacts/data_transformation/X_test.npz
  y_train_path: artifacts/data_transformation/y_train.csv
  y_test_path: artifacts/data_transformation/y_test.csv


model_trainer:
  root_dir: artifacts/model_trainer 
  model_name: model.joblib
  X_train_path: artifacts/data_transformation/X_train.npz
  X_test_path: artifacts/data_transformation/X_test.npz
  y_train_path: artifacts/data_transformation/y_train.csv
  y_test_path: artifacts/data_transformation/y_test.csv
  best_params_path: artifacts/model_trainer/best_params.yaml
  THRESHOLD : 0.30
